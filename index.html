<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="FluentOS - English C1/C2 & Chinese HSK 1 mastery routine PWA: sentence mining, shadowing, debates and spaced repetition."
    />
    <meta name="theme-color" content="#0a111f" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FluentOS" />
    <title>FluentOS - C1/C2 Mastery & Routine PWA</title>
  </head>
  <body>
    <div
      id="splash"
      style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0a111f;transition:opacity .4s ease"
    >
      <img
        src="/icons/icon-192.png"
        alt="FluentOS"
        width="96"
        height="96"
        style="border-radius:22px;box-shadow:0 8px 40px rgba(20,184,166,0.35)"
      />
      <div
        style="width:34px;height:34px;border:3px solid rgba(45,212,191,0.25);border-top-color:#2dd4bf;border-radius:50%;animation:spin 0.9s linear infinite"
      ></div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
